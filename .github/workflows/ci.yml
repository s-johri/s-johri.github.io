name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # YAML formatting. The settings live in .yamlfmt at the repository root.
  # The yamlfmt version is pinned so a new release cannot fail the build on
  # an unrelated change.
  #
  # Written in block style on purpose. Flow style triggers the upstream bug
  # that .yamlfmt documents, where a null value becomes an empty string.
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          # No go.mod here, so the module cache has nothing to restore.
          cache: false

      - name: Install yamlfmt
        run: go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0

      - name: Verify YAML formatting
        run: yamlfmt -lint .
